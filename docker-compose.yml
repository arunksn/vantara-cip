# Usage: cp .env.example .env  (set POSTGRES_PASSWORD), then: docker-compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cbp}
      POSTGRES_USER: ${POSTGRES_USER:-cbp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cbp} -d ${POSTGRES_DB:-cbp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:   # one-shot job: loads customers, transactions, predictions, segments into PostgreSQL
    build: .
    command: ["python", "-m", "src.models.batch_score", "--load-db"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cbp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cbp}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cbp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cbp}
    ports: ["8000:8000"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  dashboard:
    build: .
    command: ["streamlit", "run", "frontend/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cbp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cbp}
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
